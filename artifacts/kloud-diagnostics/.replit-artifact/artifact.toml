kind = "web"
previewPath = "/"
title = "Kloud Diagnostics & Imaging"
version = "1.0.0"
id = "artifacts/kloud-diagnostics"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20586

[services.development]
run = "pnpm --filter @workspace/kloud-diagnostics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kloud-diagnostics", "run", "build" ]
serve = "static"
publicDir = "artifacts/kloud-diagnostics/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20586"
BASE_PATH = "/"
